<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Cinematic AI Tarot Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #2a154d, #0a0514); min-height: 100vh; color: white; font-family: sans-serif; }
        .tarot-card { cursor: pointer; transition: transform 0.3s; border: 2px solid #fbbf24; }
        .tarot-card:hover { transform: scale(1.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4">
    <h1 class="text-3xl text-yellow-400 mb-8">🔮 ทำนายดวงชะตา</h1>
    <div id="deck" class="flex gap-4">
        <!-- ไพ่ 3 ใบให้เลือก -->
        <div class="tarot-card w-24 h-36 bg-purple-900 rounded-lg flex items-center justify-center" onclick="getReading('The Fool')">🃏</div>
        <div class="tarot-card w-24 h-36 bg-purple-900 rounded-lg flex items-center justify-center" onclick="getReading('The Magician')">🪄</div>
        <div class="tarot-card w-24 h-36 bg-purple-900 rounded-lg flex items-center justify-center" onclick="getReading('The World')">🌍</div>
    </div>

    <!-- Modal แสดงผล -->
    <div id="result" class="hidden fixed inset-0 bg-black/90 flex flex-col items-center justify-center p-6 text-center">
        <p id="reading-text" class="text-xl max-w-md">กำลังอ่านดวง...</p>
        <button class="mt-8 px-6 py-2 bg-yellow-500 text-black font-bold rounded-full" onclick="location.reload()">ปิด</button>
    </div>

    <script>
        const API_KEY = "AIzaSyBc9-pEXgF_38cAEBV17zB2L-Tl4T_ev5Y"; 

        async function getReading(cardName) {
            document.getElementById('result').classList.remove('hidden');
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `ทำนายไพ่ ${cardName} ให้หน่อย ขอแบบสั้นๆ ให้กำลังใจ` }] }] })
                });
                const data = await response.json();
                document.getElementById('reading-text').innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                document.getElementById('reading-text').innerText = "ขออภัยครับ พลังงานจักรวาลขัดข้อง (ลองเช็กคีย์ใหม่อีกครั้งนะครับ)";
            }
        }
    </script>
</body>
</html>
