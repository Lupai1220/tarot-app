<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tarot Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #2a154d, #0a0514); min-height: 100vh; color: white; display: flex; flex-direction: column; align-items: center; }
        .glass { background: rgba(30, 15, 50, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="p-4">
    <div class="flex gap-2 mb-8 mt-10 glass p-2 rounded-full">
        <button class="px-4 py-2 bg-purple-700 rounded-full">ภาพรวม</button>
    </div>

    <div id="drop-zone" class="w-64 h-96 border-2 border-dashed border-yellow-500 rounded-2xl flex flex-col items-center justify-center p-4">
        <span class="text-4xl mb-2">🔮</span>
        <p class="text-center text-yellow-400">คลิกที่ไพ่ด้านล่าง<br>เพื่อรับคำทำนาย</p>
    </div>

    <div class="fixed bottom-0 w-full p-4">
        <div class="flex justify-center gap-2">
            <button onclick="getReading('The Fool')" class="w-16 h-24 bg-purple-900 border-2 border-yellow-500 rounded-lg shadow-lg hover:bg-purple-800 transition">🃏</button>
            <button onclick="getReading('The Chariot')" class="w-16 h-24 bg-purple-900 border-2 border-yellow-500 rounded-lg shadow-lg hover:bg-purple-800 transition">🐎</button>
        </div>
    </div>

    <div id="result-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50">
        <div class="bg-purple-900 p-6 rounded-xl border border-yellow-500 max-h-[80vh] overflow-y-auto w-full max-w-md">
            <p id="reading-text" class="text-white text-lg whitespace-pre-wrap leading-relaxed">กำลังสื่อสารกับดวงดาว...</p>
            <button onclick="document.getElementById('result-modal').classList.add('hidden')" class="mt-6 w-full py-3 bg-yellow-500 text-black font-bold rounded-lg shadow-md hover:bg-yellow-400 transition">ปิด</button>
        </div>
    </div>

    <script>
        // ใช้ API Key ของคุณตะวัน
        const API_KEY = "AQ.Ab8RN6JFs_BeockplTZIEp9q5OlogRwGeauyQbd8_f7x7HqsKQ";

        async function getReading(cardName) {
            const modal = document.getElementById('result-modal');
            const textElement = document.getElementById('reading-text');
            
            modal.classList.remove('hidden');
            textElement.innerText = "กำลังรับคำทำนายจากไพ่ " + cardName + "...";
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: "ทำนายไพ่ทาโรต์ใบนี้ให้หน่อยครับ: " + cardName }] }] 
                    })
                });
                
                const data = await response.json();
                
                // ตรวจสอบว่า Google ส่ง Error กลับมาหรือไม่ (เช่น คีย์ผิด, โดนบล็อก)
                if (data.error) {
                     textElement.innerText = "⚠️ Google ปฏิเสธการเชื่อมต่อ:\n" + data.error.message;
                     return;
                }
                
                // ตรวจสอบว่ามีคำทำนายส่งมาปกติหรือไม่
                if (data.candidates && data.candidates.length > 0) {
                    textElement.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    textElement.innerText = "รับข้อมูลมาแล้วแต่ไม่มีคำทำนายครับ (ข้อมูลที่ได้: " + JSON.stringify(data) + ")";
                }
            } catch (e) {
                textElement.innerText = "❌ เกิดข้อผิดพลาดในระบบเว็บ:\n" + e.message;
            }
        }
    </script>
</body>
</html>
