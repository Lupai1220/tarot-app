<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">
    <h1 class="text-2xl mb-6">🔮 คลิกไพ่เพื่อดูดวง</h1>
    <div class="flex gap-4">
        <button onclick="getReading('The Fool')" class="w-20 h-32 bg-purple-800 rounded">🃏</button>
        <button onclick="getReading('The Chariot')" class="w-20 h-32 bg-purple-800 rounded">🐎</button>
    </div>
    <div id="result" class="mt-6 p-4 max-w-sm text-center"></div>

    <script>
        const API_KEY = "AIzaSyBc9-pEXgF_38cAEBV17zB2L-Tl4T_ev5Y";

        async function getReading(cardName) {
            document.getElementById('result').innerText = "กำลังทำนาย...";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `ทำนายไพ่ ${cardName} ให้หน่อย` }] }] })
                });
                const data = await response.json();
                document.getElementById('result').innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                document.getElementById('result').innerText = "ระบบขัดข้องครับ";
            }
        }
    </script>
</body>
</html>

        }
    </script>
</body>
</html>
