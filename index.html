<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tarot Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #2a154d, #0a0514); min-height: 100vh; color: white; display: flex; flex-direction: column; align-items: center; }
        .glass { background: rgba(30, 15, 50, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="p-4">
    <div class="flex gap-2 mb-8 mt-10 glass p-2 rounded-full">
        <button class="px-4 py-2 bg-purple-700 rounded-full">ภาพรวม</button>
    </div>

    <div id="drop-zone" class="w-64 h-96 border-2 border-dashed border-yellow-500 rounded-2xl flex flex-col items-center justify-center p-4">
        <span class="text-4xl mb-2">🔮</span>
        <p class="text-center text-yellow-400">คลิกที่ไพ่ด้านล่าง<br>เพื่อรับคำทำนาย</p>
    </div>

    <div class="fixed bottom-0 w-full p-4">
        <div class="flex justify-center gap-2">
            <!-- ส่งคีย์ผ่าน code โดยตรงเพื่อตัดปัญหา Netlify -->
            <button onclick="getReading('The Fool')" class="w-16 h-24 bg-purple-900 border-2 border-yellow-500 rounded-lg">🃏</button>
            <button onclick="getReading('The Chariot')" class="w-16 h-24 bg-purple-900 border-2 border-yellow-500 rounded-lg">🐎</button>
        </div>
    </div>

    <div id="result-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6">
        <div class="bg-purple-900 p-6 rounded-xl border border-yellow-500 max-h-[80vh] overflow-y-auto">
            <p id="reading-text" class="text-white text-lg">กำลังสื่อสารกับดวงดาว...</p>
            <button onclick="document.getElementById('result-modal').classList.add('hidden')" class="mt-6 w-full py-2 bg-yellow-500 text-black font-bold rounded-lg">ปิด</button>
        </div>
    </div>

    <script>
        async function getReading(cardName) {
            document.getElementById('result-modal').classList.remove('hidden');
            document.getElementById('reading-text').innerText = "กำลังเชื่อมต่อกับ AI...";
            
            try {
                // เรียกใช้ผ่าน Proxy ฟรีที่เสถียรที่สุดตอนนี้
                const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AIzaSyBc9-pEXgF_38cAEBV17zB2L-Tl4T_ev5Y')}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ทำนายไพ่ " + cardName + " ให้หน่อย" }] }] })
                });
                const data = await response.json();
                const content = JSON.parse(data.contents);
                document.getElementById('reading-text').innerText = content.candidates[0].content.parts[0].text;
            } catch (e) {
                document.getElementById('reading-text').innerText = "ขออภัย ระบบขัดข้อง (AI อาจถูกจำกัดสิทธิ์ในเบราว์เซอร์นี้)";
            }
        }
    </script>
</body>
</html>
