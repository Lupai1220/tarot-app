<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tarot Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle, #2a154d, #0a0514); min-height: 100vh; color: white; display: flex; flex-direction: column; align-items: center; }
        .glass { background: rgba(30, 15, 50, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="p-4">
    <div class="flex gap-2 mb-8 mt-10 glass p-2 rounded-full">
        <button class="px-4 py-2 bg-purple-700 rounded-full">ภาพรวม</button>
        <button class="px-4 py-2">ความรัก</button>
        <button class="px-4 py-2">การงาน</button>
        <button class="px-4 py-2">การเงิน</button>
    </div>

    <div id="drop-zone" class="w-64 h-96 border-2 border-dashed border-yellow-500 rounded-2xl flex flex-col items-center justify-center p-4">
        <span class="text-4xl mb-2">🔮</span>
        <p class="text-center text-yellow-400">ลากไพ่มาวางที่นี่<br>หรือ คลิกที่ไพ่ เพื่อทำนาย</p>
    </div>

    <div class="fixed bottom-0 w-full overflow-hidden p-4">
        <p class="text-center text-yellow-500 mb-2">✨ SELECT YOUR CARD ✨</p>
        <div class="flex justify-center -mb-10">
            <button onclick="getReading('ไพ่ใบที่ 1')" class="w-16 h-24 bg-purple-900 border-2 border-yellow-500 rounded-lg mx-1"></button>
            <button onclick="getReading('ไพ่ใบที่ 2')" class="w-16 h-24 bg-purple-900 border-2 border-yellow-500 rounded-lg mx-1"></button>
            <button onclick="getReading('ไพ่ใบที่ 3')" class="w-16 h-24 bg-purple-900 border-2 border-yellow-500 rounded-lg mx-1"></button>
        </div>
    </div>

    <div id="result-modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-6">
        <div class="bg-purple-900 p-6 rounded-xl border border-yellow-500">
            <p id="reading-text" class="text-white text-lg">กำลังทำนาย...</p>
            <button onclick="location.reload()" class="mt-6 w-full py-2 bg-yellow-500 text-black font-bold rounded-lg">ปิด</button>
        </div>
    </div>

    <script>
        const API_KEY = "AIzaSyBc9-pEXgF_38cAEBV17zB2L-Tl4T_ev5Y";

        async function getReading(cardName) {
            document.getElementById('result-modal').classList.remove('hidden');
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "ทำนายดวงชะตาจาก " + cardName + " ให้หน่อย ขอแบบแม่นๆ" }] }] })
                });
                const data = await response.json();
                document.getElementById('reading-text').innerText = data.candidates[0].content.parts[0].text;
            } catch (e) {
                document.getElementById('reading-text').innerText = "ระบบขัดข้อง โปรดลองใหม่อีกครั้งครับ";
            }
        }
    </script>
</body>
</html>
