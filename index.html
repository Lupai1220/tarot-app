<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic AI Tarot Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at 50% 50%, #2a154d 0%, #0a0514 100%); min-height: 100vh; overflow: hidden; font-family: 'Prompt', sans-serif; color: #f3f4f6; }
        .glass-panel { background: rgba(30, 15, 50, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow-border { border: 2px dashed rgba(234, 179, 8, 0.4); background: rgba(0, 0, 0, 0.2); }
        .card { cursor: grab; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: absolute; bottom: 30px; }
        .tarot-back { background: linear-gradient(135deg, #2d1154, #140529); border: 2px solid #fbbf24; }
        .tarot-front { background: linear-gradient(180deg, #160a2b 0%, #0a0314 100%); border: 3px solid #fbbf24; }
        .category-btn.active { background: rgba(107, 33, 168, 0.8); border-color: #fbbf24; color: #fbbf24; }
    </style>
</head>
<body class="flex flex-col items-center h-screen relative pt-16">
    <div class="glass-panel absolute top-6 flex space-x-4 z-10 px-6 py-2 rounded-full">
        <button class="category-btn active px-6 py-2 rounded-full border border-transparent font-medium" data-category="ภาพรวม">ภาพรวม</button>
        <button class="category-btn px-6 py-2 rounded-full border border-transparent text-gray-400 font-medium" data-category="ความรัก">ความรัก</button>
        <button class="category-btn px-6 py-2 rounded-full border border-transparent text-gray-400 font-medium" data-category="การงาน">การงาน</button>
    </div>

    <div id="drop-zone" class="w-52 h-80 rounded-2xl flex items-center justify-center glow-border flex-col text-center p-4 mt-10">
        <span class="text-yellow-400 text-4xl mb-4">🔮</span>
        <span class="text-yellow-400/80 text-sm">คลิกที่ไพ่เพื่อทำนาย</span>
    </div>

    <div id="deck-container" class="h-40 w-full relative mt-20"></div>

    <div id="result-modal" class="hidden absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-[999] p-6 text-center">
        <h2 id="loading-text" class="text-yellow-400 text-2xl animate-pulse">✨ AI กำลังทำนายดวง...</h2>
        <div id="reading-content" class="hidden flex-col items-center">
            <div class="w-56 h-80 tarot-front rounded-xl mb-6 flex flex-col items-center justify-center p-4">
                <span id="result-icon" class="text-7xl">🌍</span>
                <span id="result-name-en" class="text-yellow-400 font-bold uppercase mt-4">THE WORLD</span>
            </div>
            <p id="result-desc" class="text-gray-200 max-w-sm mb-6"></p>
            <button onclick="resetApp()" class="px-8 py-3 rounded-full bg-yellow-500 text-gray-900 font-bold">รับคำทำนายใหม่</button>
        </div>
    </div>

    <script>
        // ⚠️ ใส่ API Key ของคุณที่นี่ (เอาแค่ตัวอักษร/เลข)
        const API_KEY = "AIzaSyBc9-pEXgF_38cAEBV17zB2L-Tl4T_ev5Y"; 

        const tarotCards = [{ icon: "🃏", en: "The Fool" }, { icon: "🔮", en: "The High Priestess" }, { icon: "🐎", en: "The Chariot" }, { icon: "🌍", en: "The World" }];
        
        async function fetchGeminiReading(cardName, category) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `ทำนายไพ่ ${cardName} เรื่อง ${category} ให้หน่อย` }] }] })
                });
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (error) { return "ระบบขัดข้องชั่วคราว ลองใหม่อีกครั้งนะครับ"; }
        }

        async function processReading() {
            const randomCard = tarotCards[Math.floor(Math.random() * tarotCards.length)];
            document.getElementById('result-icon').innerText = randomCard.icon;
            document.getElementById('result-name-en').innerText = randomCard.en;
            document.getElementById('result-modal').classList.remove('hidden');
            
            const text = await fetchGeminiReading(randomCard.en, "ภาพรวม");
            document.getElementById('loading-text').classList.add('hidden');
            document.getElementById('result-desc').innerText = text;
            document.getElementById('reading-content').classList.remove('hidden');
        }

        function createDeck() {
            for (let i = 0; i < 5; i++) {
                const card = document.createElement('div');
                card.className = "card w-16 h-24 rounded-lg tarot-back";
                card.style.left = `${(i * 15) + 30}%`;
                card.addEventListener('click', processReading);
                document.getElementById('deck-container').appendChild(card);
            }
        }
        function resetApp() { location.reload(); }
        createDeck();
    </script>
</body>
</html>
